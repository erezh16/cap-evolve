# SkillOpt @ ae2f766 on AppWorld (docs/EVAL_APPWORLD_5.md §7.2). Inherits SkillOpt's own defaults; only
# the AppWorld wiring and the plan's settings are set here. run_skillopt.py fills out_root, split_dir,
# skill_init and train_size and points `_base_` at the pinned clone.
_base_: @SKILLOPT@/configs/_base_/default.yaml

model:
  backend: openai_compatible
  optimizer_backend: openai_compatible
  target_backend: openai_compatible      # validated by the trainer, never called (the adapter runs the agent)
  optimizer: aws/claude-sonnet-5-5
  target: openai/gpt-oss-120b-a100

train:
  num_epochs: 4
  batch_size: 40
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8

optimizer:
  learning_rate: 4

evaluation:
  sel_env_num: 0
  test_env_num: 0
  eval_test: false

env:
  name: appworld
  split_mode: split_dir
